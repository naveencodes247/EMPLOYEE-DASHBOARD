<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your outFyt account</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1A1D20;
      -webkit-font-smoothing: antialiased;
    }
    .email-wrapper {
      width: 100%;
      background-color: #F8F9FA;
      padding: 48px 16px;
    }
    .email-container {
      max-width: 460px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #EBECEF;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      padding: 40px 32px;
      text-align: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #C5A059;
      background-color: #FFFFFF;
      display: block;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      display: block;
    }
    .company-name {
      font-size: 20px;
      font-weight: 700;
      color: #1A1D20;
      letter-spacing: -0.02em;
      margin: 0 0 6px 0;
    }
    .welcome-text {
      font-size: 15px;
      font-weight: 600;
      color: #C5A059;
      margin: 0 0 16px 0;
    }
    .description {
      font-size: 14px;
      line-height: 1.6;
      color: #555A60;
      margin: 0 0 32px 0;
    }
    .button-wrap {
      margin: 0 0 32px 0;
    }
    .confirm-button {
      display: inline-block;
      background-color: #1A1D20;
      color: #FFFFFF !important;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 12px;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: background-color 0.2s;
    }
    .footer-text {
      font-size: 12px;
      line-height: 1.5;
      color: #8C929A;
      margin: 0;
      border-top: 1px solid #F0F2F4;
      padding-top: 24px;
    }
    .footer-brand {
      color: #1A1D20;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <div class="email-container">
            <!-- Official outFyt Logo -->
            <div class="logo-badge">
              <img 
                src="https://jfhjlibbdypicynvhfgo.supabase.co/storage/v1/object/public/branding/outfyt-logo.jpeg" 
                alt="outFyt Logo" 
                class="logo-img"
                width="64"
                height="64"
              />
            </div>

            <!-- Company Name & Welcome Message -->
            <h1 class="company-name">outFyt</h1>
            <div class="welcome-text">Welcome to outFyt</div>
            
            <p class="description">
              Please click the button below to confirm your email address and activate your account.
            </p>

            <!-- Clean Primary Confirmation Action -->
            <div class="button-wrap">
              <a href="{{ .ConfirmationURL }}" class="confirm-button" target="_blank" rel="noopener noreferrer">
                Confirm Email Address
              </a>
            </div>

            <!-- Minimal Clean Footer -->
            <p class="footer-text">
              <span class="footer-brand">outFyt.co.in</span> · Work Management Portal<br>
              If you didn't create an account with outFyt, you can safely disregard this message.
            </p>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
